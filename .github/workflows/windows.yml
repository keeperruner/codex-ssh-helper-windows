name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean CodexRemoteSetup.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-SSH-Helper-Windows-v0.2.0
          path: dist/Codex-SSH-Helper-Windows-v0.2.0.exe
